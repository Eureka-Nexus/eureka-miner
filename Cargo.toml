[package]
name = "eureka-miner"
version = "0.1.0"
edition = "2021"
authors = ["Eureka Nexus"]
description = "Official CPU and GPU miner for the Eureka Nexus (EKNX) ecosystem."
repository = "https://github.com/Eureka-Nexus/eureka-miner"
homepage = "https://eurekanexus.pt"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

sysinfo = "0.37"
num_cpus = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"

rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }

thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
